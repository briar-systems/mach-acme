name: CI

on:
  pull_request:
  # a tag push has no base branch, so cd.yml asks for the full tier
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin]

permissions:
  contents: read

jobs:
  # test/live drives a real acme authority on loopback, started and stopped by
  # the setup and teardown hooks on x86_64-linux. it resolves the library by
  # path, so it pulls from a clean dep/.
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # crypto 0.17+ links a secret multiply, so the aarch64 tests need FEAT_DIT
      dit: required
      subprojects: >-
        [{"path": "test/live", "clean-dep": true, "legs": ["x86_64-linux"]}]
      evidence: |
        .tools/run/*.log

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
