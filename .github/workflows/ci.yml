name: CI

on:
  pull_request:
  # a tag push has no base branch, so cd.yml asks for the full tier
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin, fuzz]

permissions:
  contents: read

jobs:
  # test/live drives a real acme authority on loopback, started and stopped by
  # the setup and teardown hooks on x86_64-linux. it resolves the library by
  # path, so it pulls from a clean dep/.
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # http 0.25.1 requires mach 6.5
      mach-version: v6.5.0
      # mach tests one artifact's closure, and src/test/protocol.mach is reached only by the tests artifact
      test-selections: '[["--lib", "tests"]]'
      # crypto 0.17+ links a secret multiply, so the aarch64 tests need FEAT_DIT
      dit: required
      # the fuzz lane is built so it cannot rot, and replayed by the fuzz job
      subprojects: >-
        [{"path": "test/live", "clean-dep": true, "legs": ["x86_64-linux"]},
         {"path": "test/fuzz", "build": true, "test": false, "legs": ["x86_64-linux"]}]
      evidence: |
        .tools/run/*.log

  # the fuzz lane's deterministic replay: every retained input in
  # test/fuzz/corpus answered by its boundary's harness, on the heavy tier
  fuzz:
    if: github.base_ref == 'main' || inputs.heavy == 'all' || inputs.heavy == 'fuzz'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: briar-systems/.github/.github/actions/seed-mach@main
        with:
          tag: v6.5.0
      - name: build the lane
        run: |
          mach dep pull test/fuzz
          mach build test/fuzz --profile debug
          mach build test/fuzz --profile release
      # both profiles, because optimisation has changed observable behaviour before
      - name: replay the corpus
        run: |
          timeout 10m test/fuzz/out/linux-x86_64/debug/bin/fuzz replay
          timeout 10m test/fuzz/out/linux-x86_64/release/bin/fuzz replay

  gate:
    if: always()
    needs: [lib, fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
