[project]
id = "acme"
mach = "^7"
version = "0.14.1"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

# the library, and the only artifact `mach build .` selects
[artifact.acme]
kind = "static"
default = true
export = true
entry = "lib/acme.mach"
out = "{project.work}/lib/acme{artifact.suffix}"
targets = ["*"]
link = []
need = []

# test-only: reaches the modules whose tests the library does not, for `mach test . -a tests`
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "{project.work}/lib/tests{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "branch/dev"

[dep.json]
git = "https://github.com/briar-systems/mach-json"
ref = "branch/dev"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "branch/dev"
