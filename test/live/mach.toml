[project]
id = "acme-live-test"
mach = "^5.9"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.acme-live-test]
kind = "static"
entry = "tests.mach"
out = "lib/acme-live-test"
targets = ["*"]
link = []
need = []

[dep.acme]
path = "../.."

# std, crypto and http are pinned here because a path dependency carries no
# pin for a dependency it selects by version, and this tree is not committed
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v6.0.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "tag/v0.18.0"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "tag/v0.15.0"
