[project]
id = "acme-live-test"
version = "0.0.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.acme-live-test]
kind = "static"
entry = "tests.mach"
out = "lib/acme-live-test"
targets = ["*"]
link = []
need = []

[dep.acme]
path = "../.."
