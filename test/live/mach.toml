[project]
id = "acme_live"
mach = "^7"
version = "0.0.0"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.acme-live-test]
kind = "static"
entry = "tests.mach"
out = "{project.work}/lib/acme-live-test{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.acme]
path = "../.."

# std, crypto, json and http are pinned here because a path dependency carries no
# pin for a dependency it selects by ref, and this tree is not committed
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "branch/dev"

[dep.json]
git = "https://github.com/briar-systems/mach-json"
ref = "branch/dev"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
ref = "branch/dev"
